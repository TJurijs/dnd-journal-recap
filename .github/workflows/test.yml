name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run pytest
        env:
          # The bot's config.py validates these as required even though
          # tests don't actually hit Discord/Gemini.
          DISCORD_BOT_TOKEN: dummy
          GEMINI_API_KEY: dummy
        run: pytest tests/ -q
