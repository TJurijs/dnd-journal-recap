# Gemini API token pricing — USD per 1,000,000 tokens.
#
# SOURCE: https://ai.google.dev/gemini-api/docs/pricing  (read 2026-05-27)
# Keyed by MODEL NAME (must match the model strings in models.yaml). Switch a
# step's model in models.yaml and the cost calc uses that model's price here.
# A model not listed falls back to `default` (and the bot logs a warning).
#
# `long_threshold` / `input_long` / `output_long`: some models charge a higher
# rate once a single prompt exceeds N input tokens. Omit them for flat-rate
# models.

prices:
  # Gemini 3.1 Pro — summarize (every recap) + roster/scratchpad build (every
  # /initialize). Tiered: prompts over 200k input tokens cost ~2x.
  gemini-3.1-pro-preview:
    input: 2.00
    output: 12.00
    long_threshold: 200000
    input_long: 4.00
    output_long: 18.00

  # Gemini 3.1 Flash Lite — transcribe only, which feeds AUDIO. This input rate
  # is the AUDIO rate ($0.50/1M), not the text rate ($0.25). If you ever point a
  # text step at this model, split out the text rate.
  gemini-3.1-flash-lite:
    input: 0.50
    output: 1.50

  # Gemini 3 Flash — roster/scratchpad incremental updates (text input).
  gemini-3-flash-preview:
    input: 0.50
    output: 3.00

# Fallback for any model not listed above (historical Gemini Flash rate).
default:
  input: 0.15
  output: 0.60
